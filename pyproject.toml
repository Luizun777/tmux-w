[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmuxw"
version = "0.1.0"
description = "Clon de tmux para Windows (PowerShell) sobre ConPTY"
requires-python = ">=3.10"
dependencies = [
    "pywinpty==2.0.13",
    "pyte>=0.8.1",
]

[project.scripts]
tmuxw = "tmuxw.cli:main"

[tool.setuptools]
packages = ["tmuxw"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
line-length = 100
