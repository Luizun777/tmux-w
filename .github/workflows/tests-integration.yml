name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]" 2>&1 || pip install -e . && pip install pytest pytest-xdist pytest-cov

      - name: Run integration tests
        run: python -m pytest tests/test_integration.py -n auto -v --tb=short

      - name: Run all tests with coverage (final check)
        run: |
          python -m pytest tests/ -n auto --cov=tmuxw --cov-report=xml --cov-report=term --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
